name: "🐞 Anomalie / Bug"
description: "Signaler un dysfonctionnement de l'application CESIZen"
title: "[BUG] "
labels: ["bug", "à trier"]
body:
  - type: markdown
    attributes:
      value: "Merci de décrire l'anomalie le plus précisément possible pour faciliter sa correction."
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Que se passe-t-il ?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Aller sur '...'
        2. Cliquer sur '...'
        3. Observer l'erreur
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Criticité
      description: Impact estimé pour l'utilisateur
      options:
        - Bloquant (service inutilisable)
        - Majeur (fonctionnalité importante indisponible)
        - Mineur (gêne, contournement possible)
        - Cosmétique
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environnement
      placeholder: "navigateur, OS, environnement (préprod/production)"
