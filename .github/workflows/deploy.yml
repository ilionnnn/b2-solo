name: Deploy

# Déploiement continu vers la VM de préproduction.
#
# La VM (VirtualBox, derrière NAT/bridge sur le poste) n'est PAS joignable
# depuis les runners GitHub hébergés. On utilise donc un *runner self-hosted*
# installé sur la VM : il tire les jobs depuis GitHub (connexion sortante) et
# exécute le déploiement en local. Le runner doit porter le label `preprod`.
on:
  push:
    branches: [preprod]
  workflow_dispatch:

concurrency:
  group: deploy-preprod
  cancel-in-progress: true

jobs:
  deploy:
    name: Déploiement préprod (VM self-hosted)
    runs-on: [self-hosted, preprod]
    defaults:
      run:
        working-directory: bloc2-solo

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Déploiement (build + stack Docker)
        run: bash deploy.sh
