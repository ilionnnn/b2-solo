name: CI

# Intégration continue : à chaque push / pull request, le code est vérifié
# (style, tests automatisés, build des assets) avant tout déploiement.
on:
  push:
    branches: [main, preprod]
  pull_request:
    branches: [main, preprod]

# L'application Laravel se trouve dans le sous-dossier bloc2-solo/.
defaults:
  run:
    working-directory: bloc2-solo

jobs:
  tests:
    name: Lint & Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo, pdo, sqlite, pdo_sqlite, bcmath
          coverage: none
          tools: composer:v2

      - name: Cache des dépendances Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('**/composer.lock') }}

      - name: Installation des dépendances PHP
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Audit de sécurité des dépendances
        run: composer audit --no-interaction

      - name: Préparation de l'environnement de test
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Vérification du style de code (Laravel Pint)
        run: vendor/bin/pint --test

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bloc2-solo/package-lock.json

      - name: Build des assets front-end
        run: |
          npm ci
          npm run build

      - name: Exécution des tests automatisés
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan test
