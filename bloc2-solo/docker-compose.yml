# Environnement de déploiement conteneurisé pour CESIZen.
# Trois services : application (PHP-FPM), serveur web (Nginx), base de données (MySQL).
# Démarrage : docker compose up -d --build

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cesizen-app:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Ces valeurs priment sur celles du .env (connexion au service `db`).
      DB_HOST: db
      DB_CONNECTION: mysql
      DB_DATABASE: cesizen
      DB_USERNAME: cesizen
      DB_PASSWORD: secret
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Le code (issu de l'image) peuple ce volume, partagé avec Nginx.
      - app-code:/var/www/html
      - storage-data:/var/www/html/storage
    networks:
      - cesizen

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - app-code:/var/www/html:ro
    depends_on:
      - app
    networks:
      - cesizen

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cesizen
      MYSQL_USER: cesizen
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cesizen

volumes:
  db-data:
  storage-data:
  app-code:

networks:
  cesizen:
    driver: bridge
